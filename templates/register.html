{% extends 'base.html' %}

{% block title %}ثبت‌نام | مدیریت مالی شخصی{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>ساخت حساب جدید</h1>
    <p class="subtitle">چند ثانیه وقت لازم است</p>

    <div id="error-box" class="alert hidden"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="username">نام کاربری</label>
        <input id="username" class="ltr" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="email">ایمیل</label>
        <input id="email" type="email" class="ltr" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">رمز عبور</label>
        <input id="password" type="password" class="ltr" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label for="password2">تکرار رمز عبور</label>
        <input id="password2" type="password" class="ltr" autocomplete="new-password" required>
      </div>
      <button class="btn btn-block" id="submit-btn" type="submit">ثبت‌نام</button>
    </form>

    <p class="switch">قبلاً ثبت‌نام کرده‌اید؟ <a href="/login/">ورود</a></p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  if (Auth.refresh) window.location.href = '/';

  const form = document.getElementById('register-form');
  const errorBox = document.getElementById('error-box');
  const button = document.getElementById('submit-btn');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    hideError(errorBox);
    button.disabled = true;

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/auth/register/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username,
          email: document.getElementById('email').value.trim(),
          password,
          password2: document.getElementById('password2').value,
        }),
      });

      if (!res.ok) {
        showError(errorBox, formatErrors(await res.json()));
        return;
      }

      // ورود خودکار بعد از ثبت‌نام
      const login = await fetch('/api/auth/login/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (login.ok) {
        Auth.save(await login.json());
        window.location.href = '/';
      } else {
        window.location.href = '/login/';
      }
    } catch (error) {
      showError(errorBox, 'ارتباط با سرور برقرار نشد.');
    } finally {
      button.disabled = false;
    }
  });
</script>
{% endblock %}
